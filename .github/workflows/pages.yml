name: pages

on:
  push:
    branches: [v2]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

      - name: Verify the page and the canonical logo asset
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "https://www.oimlsmart.org/img/components/" dist/index.html
          url=$(grep -o 'https://www.oimlsmart.org/img/components/[a-z-]*-light.svg' dist/index.html | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "canonical logo: $url → HTTP $code"
          [ "$code" = "200" ]
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

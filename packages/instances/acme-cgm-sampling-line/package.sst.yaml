behavior: behavior.js
samples:
  - samples/healthy.yaml
  - samples/restricted.yaml
  - samples/leaking.yaml
provenance:
  certificate: "R144/2024-DE-12-117/SAMPLE-LINE"
  first_issued: "2024-02-08"

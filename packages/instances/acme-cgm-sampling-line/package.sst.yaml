  ambient_co_ppm:          { value: 0.4,   unit: ppm }          # typical ambient CO
  ambient_nox_ppm:         { value: 0.02,  unit: ppm }
  ambient_co2_percent:     { value: 0.04,  unit: percent }      # 400 ppmv CO2
  ambient_h2o_percent:     { value: 1.2,   unit: percent }      # 50% RH at 20°C

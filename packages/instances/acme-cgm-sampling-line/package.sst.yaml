classification:
  construction: heated-line
  active_components: [probe, pump, filter, condenser]
design_parameters:
  line_volume_l:           { value: 0.05,  unit: L }            # 50 mL internal volume
  nominal_flow_l_min:      { value: 1.5,   unit: l_per_min }    # matches the analyzer's sample_flow_l_min

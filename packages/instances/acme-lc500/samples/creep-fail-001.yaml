# ACME LC-500 — creep-fail-001 sample. The creep-fail physics stamped
# LC500-001: unit 001 in the world where its creep fails.
#
# Why this variant exists: the smart platform's failure-branch demo
# provisions its chain with the demo serial (LC500-001), so the failing
# unit must serve that serial for the Connect step to pass and the run to
# record the failing physics. The serial travels with the sample (the
# twin IS the sampled unit — the boot mirrors serial_number into the
# twin identification); stamping a serial is choosing a sample, never a
# runtime switch. Boot it with:
#
#   npm start -- creep-fail-001
#
# The custody-refusal beat (the twin serves a serial the platform's
# sample does not declare) keeps booting `creep-fail` (LC500-002).
sample_name: creep-fail-001
serial_number: LC500-001
kind_scenario: creep-fail
description: >
  Creep beyond MPE with a slow drift tail, stamped LC500-001 — the
  failure-branch demo's failing unit on the demo serial. Fails the
  30-minute creep test; the 20–30-minute band drifts past 0.15 × |MPE|.
custody:
  - { at: "2024-01-15", event: "manufactured", location: "ACME Darmstadt" }
  - { at: "2024-02-01", event: "type-test",    location: "PTB Braunschweig", note: "Creep test failed at minute 28." }
overrides:
  creep_coefficient: 0.004
  creep_tau_s: 120
  creep_slow_coefficient: 0.002
  creep_slow_tau_s: 2400
fidelity: {}

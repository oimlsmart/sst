# ACME LC-500 physics coefficients — sim-owned, not in the R 60 SSOT.
# These are the values the instance's behavior.js feeds to the
# r60/mechanical-*, r60/transduction-strain-gauge, and r60/conditioning-digital
# stages (see the kind's physics-chain.yaml).

# Stage 1 — mechanical (column compression profile)
mechanical:
  compliance_kg_per_mm: 2.0e-6           # datasheet rated deflection
  hysteresis_class: 0.45                  # R 60 hysteresis class
  creep_coefficient: 2.0e-5               # good-cell baseline — well inside the class
                                          # allowance (0.021 kg at a 450 kg dwell: creep
                                          # ≈ 0.009 kg). Re-tuned for the elastic-fraction
                                          # creep law (the composer's gap-3 fix): the
                                          # coefficient multiplies the applied load in kg.
  creep_tau_s: 300
  resonant_hz: 250
  off_center_sensitivity: 0.001

# Stage 2 — transduction (Wheatstone bridge)
transduction:
  sensitivity_mVperV: 2.0
  gauge_factor: 2.0
  excitation_V: 10
  tc_zero_per_degC: 0.0001
  tc_span_per_degC: 0.0002
  barometric_per_kPa: 0.00005
  reference_temp_degC: 20
  reference_pressure_kPa: 101.325

# Stage 3 — conditioning (digital stack)
conditioning:
  stack: digital                          # analog-passive | analog-active | digital | digital-processing
  scale_interval_kg: 0.05
  capacity_kg: 500
  filter_tau_s: 1.0
  linearization_error_kg: 0.01
  compensation_residual_per_degC: 0.0005
  noise_sigma_kg: 0.005

# Warm-up + drift
temporal:
  warm_up_tau_s: 60
  span_drift_per_day: 0.000005

# Thermal hysteresis (post-cycle memory)
thermal_hysteresis:
  per_degC: 0.00002
  tau_s: 3600

# The paired analogue-passive indicator (spec §14) — a 500 kg dial at
# 5 kg graduations alongside the digital stack.
paired_dial:
  capacity_kg: 500
  graduation_kg: 5
  unit: kg

# Default fidelity — the honest twin. Damage scenarios override.
fidelity:
  served_offset_kg: 0
  served_lag_s: 0

# The bench's load application device (R 60-2, 2.7.2 — the force-generating
# system the cell is tested WITH; never a free weight): a 10 kN deadweight
# force standard machine — sized to the cell: it covers E_max = 500 kg
# (≈5 kN) with headroom for the preload discipline (3× D_max, sequential).
# The class is the machine's ISO 376 analog: class 00 deadweight primaries
# hold ±0.005 % or better; this bench machine sits at comparator class
# (±0.05 %) so the nominal-vs-realized lesson is VISIBLE at the cell's
# 0.05 kg scale interval. Realistic classes: 0.005 % (deadweight primary),
# 0.02 % (lever-amplified), 0.05 % (servo-hydraulic comparator).
# Top-level flat keys — the boot flattener carries top-level numerics as-is.
lad_capacity_kg: 1000               # 10 kN — covers the 500 kg cell + overload
lad_class_fraction: 0.0005          # ±0.05 % systematic bound (class 0.5)
lad_repeatability_fraction: 0.0002  # 0.02 % per-application repeatability
lad_default_rate_kg_per_s: 25       # the shock-free ramp (R 60-2, 2.7.3.3)

# The bench's climatic chamber (R 60-3, 4.10.4): a 600 L climatic chamber
# (the cell, its fittings and the cabling feed-through fit inside; R 60
# equipment is sized to the instrument's dimensions — a 500 kg column cell
# gets a chamber, a 600 kN canister cell would need a climate ROOM and a
# very different machine). Ratings per the IEC 60068-3-5 figures of the
# real 600 L class: 3 °C/min heating/cooling, ±0.2 °C temporal stability,
# ±0.5–2 °C spatial, 10–98 %RH ±1.5 %RH.
chamber_temp_ramp_degC_per_min: 3
chamber_temp_stability_degC: 0.2
chamber_temp_overshoot_degC: 0.4
chamber_humidity_control: 1
chamber_humidity_ramp_percent_rh_per_min: 5
chamber_humidity_stability_percent_rh: 1.5

# R 129 MPE envelope per axis.
# Source: R 129-1 §4.1.2 (per-axis MPE ±1.0 d).

classes:
  standard:
    bands:
      - { axis: [length, width, height], mpe_factor_d: 1.0 }
  high_precision:
    bands:
      - { axis: [length, width, height], mpe_factor_d: 0.5 }

# The MPE for dimensions is per-axis ±1.0 d (the scale interval). There
# are no class-style step functions like R 60's; each axis gets the same
# ±d tolerance.

additional_limits:
  protrusion_resolution_cm:
    description: Minimum resolvable protrusion.
    limit_cm: 1.0
  sampling_step_cm:
    description: Distance along the conveyor between samples.
    derive: conveyor_speed * sampling_period
  speed_of_movement_effect:
    description: >
      The along-track error grows with conveyor speed (the "speed of
      movement effect" per R 129-1 §A.3).
    formula: error_cm = conveyor_speed_m_s * filter_tau_s

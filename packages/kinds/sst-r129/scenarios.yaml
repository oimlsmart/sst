# R 129 kind-level damage scenarios.

fresh:
  description: All coefficients inside R 129-1 limits — passes the type test.
  overrides: {}

beam-occlusion:
  description: An obstruction in the light section — missed or partial readings.
  overrides: {}

scanner-tilt:
  description: The scan head is tilted — biased axis dimensions.
  overrides:
    scannerTiltEffect: 1.0

encoder-slip:
  description: The belt encoder slips — along-track error grows.
  overrides:
    encoderSlipEffect: 1.0

ambient-light:
  description: Ambient light exceeds rated — degraded silhouette.
  overrides:
    ambientLightSusceptibility: 1.0

thermal-residual:
  description: Post-temperature-cycle residual — calibration drift.
  overrides:
    thermalResidualEffect: 1.0

lying-twin:
  description: Honest physics; the served dimensions carry a mapping offset.
  overrides: {}
  fidelity:
    servedOffsetKg: 0.5        # field name reused for dimension offset (cm)
    servedLagS: 0

stale-twin:
  description: Honest physics and values; servedAt lags beyond freshness.
  overrides: {}
  fidelity:
    servedOffsetKg: 0
    servedLagS: 30

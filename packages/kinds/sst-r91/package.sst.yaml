description: >
  Doppler radar speed meters (stationary K-band CW; 20-180 km/h).
  Carries classification axes (carrier band, antenna type, install
  class), the R 91-1 §6.4 stationary MPE envelope, the active-domain
  /world vocabulary (setTarget, setRain, setOscillatorDrift, …), the
  physics-stage template (emission → reflection → demodulation →
  estimation → conditioning), and the TypeScript contract every R 91
  instance's behavior.js must satisfy.

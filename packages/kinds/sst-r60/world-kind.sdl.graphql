# R 60 load-cell /world Mutation surface — kind-level SDL fragments.
# The instance's behavior.js provides the handlers; the runtime binds
# SDL field → handler via world-kind.yaml.

extend type Mutation {
  """Apply a load (in kg) to the cell directly — the idealized deadweight
  placement (instantaneous, error-free). The machine-driven path is
  ladApply: R 60-2, 2.7.2's force-generating system."""
  placeLoad(massKg: Float!): WorldState!

  """Remove the applied load (return to dead load)."""
  removeLoad: WorldState!

  """Drive the bench's load application device (the force-generating
  system of R 60-2, 2.7.2): ramp toward the NOMINAL target load at the
  declared rate (shock-free, R 60-2, 2.7.3.3). The cell feels the
  machine's REALIZED load — nominal scaled by the machine's calibration
  state plus the per-application repeatability."""
  ladApply(loadKg: Float!, rateKgPerS: Float): WorldState!

  """Ramp the load application device back to the dead load."""
  ladRelease(rateKgPerS: Float): WorldState!

  """Configure the load application device (capacity, class bound,
  repeatability, default rate). Absent args fall back to the instance's
  lad_* coefficients, then the built-in defaults."""
  ladConfigure(capacityKg: Float, classFraction: Float, repeatabilityFraction: Float, defaultRateKgPerS: Float): WorldState!

  """Ramp the bench's climatic chamber toward the setpoints (R 60-3,
  4.10.3/4.10.4): the air moves at the chamber's rated rate, overshoots
  slightly on approach, and holds with its temporal stability — the cell
  soaks after the air per its own thermal constants. Humidity only when
  the chamber controls it. The direct setEnvironment path disengages."""
  chamberSet(temperatureDegC: Float!, humidityPercentRh: Float): WorldState!

  """Switch the chamber off (the climate drifts back to the lab ambient)."""
  chamberOff: WorldState!

  """Configure the chamber (ramp rate, stability, overshoot, humidity
  control). Absent args fall back to the instance's chamber_*
  coefficients, then the built-in defaults."""
  chamberConfigure(tempRampDegCPerMin: Float, tempStabilityDegC: Float, tempOvershootDegC: Float, humidityControl: Boolean, humidityRampPercentRhPerMin: Float, humidityStabilityPercentRh: Float): WorldState!

  """Configure the bench's indicating instrument (R 60-2, 2.7.2's second
  half — active only for analogue-passive stacks, where the LAB's
  indicator forms the reading from the cell's bridge signal)."""
  indicatorConfigure(gainErrorFraction: Float, offsetKg: Float, scaleIntervalKg: Float, noiseSigmaKg: Float): WorldState!

  """Inject a twin-fidelity offset/lag (a firmware-mapping fault; spec §8.1).
  The ground truth is unaffected — only the SERVED value drifts."""
  setFidelity(servedOffsetKg: Float, servedLagS: Float): WorldState!

  """Restore the honest twin (clear any injected fidelity knobs)."""
  fidelityReset: WorldState!

  """Configure the post-cycle thermal-hysteresis residual (the memory of
  a temperature cycle that didn't quite return)."""
  setThermalHysteresis(perDegC: Float!, tauS: Float): WorldState!
}

"""The bench's load application device state (the force machine):
the nominal setpoint the operator demanded, the ramp's current position,
and the realized load the cell physically feels."""
type LoadDeviceState {
  engaged: Boolean!
  phase: String!
  targetKg: Float!
  nominalKg: Float!
  actualKg: Float!
  rateKgPerS: Float!
  capacityKg: Float!
  classFraction: Float!
  repeatabilityFraction: Float!
  calErrorFraction: Float!
}

"""The bench's climatic chamber state (R 60-3, 4.10.3/4.10.4): the
setpoints the operator demanded and the realized climate the cell soaks
in."""
type ChamberDeviceState {
  engaged: Boolean!
  phase: String!
  setpointTempDegC: Float!
  actualTempDegC: Float!
  setpointHumidityPercentRh: Float
  actualHumidityPercentRh: Float
  tempRampDegCPerMin: Float!
  tempStabilityDegC: Float!
  humidityControl: Boolean!
}

"""The bench's indicating instrument state (R 60-2, 2.7.2): present only
for analogue-passive pairings — the LAB's indicator forms the reading."""
type IndicatorDeviceState {
  present: Boolean!
  kgPerMVperV: Float!
  gainErrorFraction: Float!
  offsetKg: Float!
  scaleIntervalKg: Float!
  readingKg: Float!
}

# The GroundTruth type extension this kind contributes (added to the
# base's GroundTruth via the runtime's schema composition).
extend type GroundTruth {
  appliedLoadKg: Float!
  strainMm: Float!
  spanDriftFraction: Float!
  thermalOffsetMVperV: Float!
  # The simulated clock at the reading (seconds; world time, never wall).
  clockS: Float!
  # The environment the physics ran under (the D 11 conditions — set
  # via setEnvironment, read back here; TODO.integration/06 gap 1).
  environment: Environment!
  # The bench's load application device (null when the instance declares
  # no machine — the direct placeLoad path then carries the loading).
  lad: LoadDeviceState
  # The bench's climatic chamber (null likewise; while engaged it owns
  # the temperature, and the humidity when humidity-controlled).
  chamber: ChamberDeviceState
  # The bench's indicating instrument (null unless the instance is an
  # analogue-passive pairing that declares one).
  indicator: IndicatorDeviceState
}

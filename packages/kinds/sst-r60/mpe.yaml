# R 60 Maximum Permissible Error envelope per accuracy class.
# Source: R 60-1 §3.5.2, table 3-7; smart/data/r60/specification/requirements/class-specific.yaml.
# Formula: MPE(load) = band_factor * v_min * p_lc
#   where band_factor depends on the load (expressed in intervals).

# Intervals: load / v_min  (so 500 v_min means load = 500 * v_min kg)
# p_lc: the load-cell apportionment factor (typically 0.7)

classes:
  A:
    bands:
      - { intervals: [0,    50000], factor: 0.5 }
      - { intervals: [50000, ∞],    factor: 1.0 }
  B:
    bands:
      - { intervals: [0,    5000],  factor: 0.5 }
      - { intervals: [5000, 50000], factor: 1.0 }
      - { intervals: [50000, ∞],    factor: 1.5 }
  C:
    bands:
      - { intervals: [0,    500],   factor: 0.5 }
      - { intervals: [500,  2000],  factor: 1.0 }
      - { intervals: [2000, 4000],  factor: 1.5 }
      - { intervals: [4000, ∞],     factor: 2.0 }   # capped by the class number (C6 ⇒ n_lc ≤ 6000)
  D:
    bands:
      - { intervals: [0,    50],    factor: 1.0 }
      - { intervals: [50,   200],   factor: 2.0 }
      - { intervals: [200,  1000],  factor: 3.0 }
      - { intervals: [1000, ∞],     factor: 5.0 }   # capped by class number (D1 ⇒ n_lc ≤ 1000)

# The runtime uses this in two places:
#   1. the bench's Graph renders the MPE band around the actual line
#   2. the /world can compute a current-mpe field for a certification harness

additional_limits:
  creep:
    limit: 0.7                      # |creep| ≤ 0.7 × |MPE| over 30 min
    intermediate_limit: 0.15        # |creep between 20-30 min| ≤ 0.15 × |MPE|
  repeatability_runs:
    A: 5
    B: 5
    C: 3
    D: 3
  temperature_increment_degC:
    A: 2
    B: 5
    C: 5
    D: 5

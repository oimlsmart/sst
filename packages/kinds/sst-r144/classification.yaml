# R 144 classification axes.

axes:
  measured_components:
    scope: family
    values: [[CO], [NOx], [CO_NOx], [SO2], [O3], [CO_NOx_SO2_O3], multi]
    r144_ref: "R 144-1 §3"
    description: >
      The set of components the analyzer measures. Single-component
      analyzers (CO only) are common; multi-component covers full AQMS.
  detection_principle:
    scope: family
    values: [NDIR, chemiluminescence, UV-fluorescence, UV-photometry, electrochemical, PAS, FTIR]
    r144_ref: "R 144-1 §4"
    description: >
      The transduction principle. NDIR (CO), chemiluminescence (NOx),
      UV-fluorescence (SO2), UV-photometry (O3). The detection principle
      is per-component (an analyzer may use different principles for
      different components).
  sample_method:
    scope: family
    values: [extractive, in-situ, open-path]
    r144_ref: "R 144-1 §5"
  drift_class:
    scope: group
    values: [class-1, class-2, class-3]
    r144_ref: "R 144-1 §6"
    description: >
      The drift class. Class-1: 1% per day. Class-2: 2% per day. Class-3: 5% per day.
  range_class:
    scope: group
    values: [class-A, class-B, class-C]
    description: >
      The range class — defines the minimum/maximum measureable
      concentrations per component.

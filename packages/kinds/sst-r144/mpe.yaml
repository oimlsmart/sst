# R 144 MPE envelope per component.
# Source: R 144-1 §6 (the per-class drift and response-time limits).

classes:
  class-1:                            # high stability
    bands:
      - { concentration_range_pct_of_max: [0, 15], mpe_pct_of_reading: 7 }
      - { concentration_range_pct_of_max: [15, ∞], mpe_pct_of_reading: 5 }
    drift_per_day_pct: 1
  class-2:                            # standard
    bands:
      - { concentration_range_pct_of_max: [0, 15], mpe_pct_of_reading: 10 }
      - { concentration_range_pct_of_max: [15, ∞], mpe_pct_of_reading: 7 }
    drift_per_day_pct: 2
  class-3:                            # industrial
    bands:
      - { concentration_range_pct_of_max: [0, 15], mpe_pct_of_reading: 15 }
      - { concentration_range_pct_of_max: [15, ∞], mpe_pct_of_reading: 10 }
    drift_per_day_pct: 5

# R 144 uses percent-of-reading MPE (not absolute like R 91, not
# interval-based like R 60). The runtime renders the MPE band as a
# proportional corridor around the actual line.

additional_limits:
  response_time_t90_s:
    description: Time to 90% of step response.
    limit_s: 60
  zero_noise_ppb:
    description: Zero-signal noise (peak-to-peak).
    limit_ppb: 0.5
  interference_max_pct:
    description: Cross-sensitivity to interferents.
    limit_pct: 2

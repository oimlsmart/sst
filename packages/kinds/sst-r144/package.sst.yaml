description: >
  Continuous gas monitors (CO by NDIR, NOx by chemiluminescence; gas
  bench, drift classes, cross-sensitivity, zero/span calibration).
  Carries classification axes (measured components, detection
  principle, sample method), the active-domain /world vocabulary
  (setGasConcentration, setSampleFlow, zeroCalibration, …), the
  physics-stage template (sampling → transduction → conditioning), and
  the TypeScript contract every R 144 instance's behavior.js must
  satisfy.

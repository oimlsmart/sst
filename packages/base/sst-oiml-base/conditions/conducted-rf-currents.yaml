id: conducted-rf-currents
title: Conducted RF currents (common mode)
kind: transient
classification: disturbance
iec_standard: [IEC 61000-4-6, IEC 61000-4-1]
d11_table: 31
d11_section: "8.7"
applicability: [electronic]
description: >
  Conducted RF disturbances (common-mode) on leads, 0.15-80 MHz,
  amplitude-modulated (80% AM, 1 kHz). Disturbance: induces indication

id: ripple-on-dc-mains
title: Ripple on DC mains
kind: transient
classification: disturbance
iec_standard: [IEC 61000-4-17, IEC 61000-4-1]
d11_table: 19
d11_section: "8.7"
applicability: [electronic]
description: >
  AC ripple superimposed on the DC supply. Disturbance: induces
  indication noise at the ripple frequency.
severity_levels:
  - { level: 1, ripple_percent_of_nominal: 2 }
  - { level: 2, ripple_percent_of_nominal: 5, preferred: true }
  - { level: 3, ripple_percent_of_nominal: 10 }
  - { level: 4, ripple_percent_of_nominal: 15 }

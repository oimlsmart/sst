id: vlf-lf-disturbances
title: VLF/LF disturbances on mains
kind: transient
classification: disturbance
iec_standard: [IEC 61000-4-19, IEC 61000-4-1]
d11_table: 25
d11_section: "8.7"
applicability: [electronic]
description: >
  Conducted disturbances in the very-low/low-frequency range (2-150 kHz)
  on mains leads. Disturbance: conducted noise that couples into the
  instrument's analog front-end.
severity_levels:
  - { level: 1, differential_percent: 2 }
  - { level: 2, differential_percent: 5 }
  - { level: 3, differential_percent: 10, preferred: true }
  - { level: 4, differential_percent: 20 }
frequency_range_khz: [2, 150]
